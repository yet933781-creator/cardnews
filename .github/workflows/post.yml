name: 인스타그램 게시

on:
  push:
    branches: [main]
    paths: ["approved/**"]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 예약 시각이 된 게시물 확인

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 최신 게시 기록 받아오기 (중복 게시 방지)
        run: |
          git fetch --depth=1 origin main
          git reset --hard origin/main
          echo "POST_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 승인된 카드뉴스 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/post_instagram.py
      - name: 게시 기록 저장
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add approved/*/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "게시 기록 저장 [skip ci]" && git push)
