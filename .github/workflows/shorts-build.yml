name: 쇼츠 영상 제작

on:
  push:
    branches: [main]
    paths: ["shorts/drafts/**/script.json", "picks/shorts/drafts/**/script.json", "tools/make_short.py", "tools/render.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치 (한글 글꼴, 영상, AI 음성)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg > /dev/null
          pip install -q pillow edge-tts
      - name: 바뀐 대본만 영상으로 제작
        run: python tools/make_short.py --changed 2>&1 | tee build.log; s=${PIPESTATUS[0]}; [ $s -eq 0 ] || { echo "::error::$(tail -c 900 build.log | tr '\n' ' ')"; exit $s; }
        shell: bash
      - name: 영상 저장
        run: |
          git config user.name "cardnews-bot"
          git config user.email "cardnews-bot@users.noreply.github.com"
          git add shorts/drafts picks/shorts/drafts
          git diff --cached --quiet && exit 0
          git commit -m "쇼츠 영상 제작 [skip ci]"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
